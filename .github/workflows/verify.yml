name: Verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  verify:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache npm downloads
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-22-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-22-npm-

      - name: Setup PostgreSQL 16
        shell: pwsh
        env:
          PGPASSWORD: ehsbha_test_pass
        run: |
          choco install postgresql16 --params "/Password:ehsbha_test_pass" -y --no-progress
          $pgBin = "C:\Program Files\PostgreSQL\16\bin"
          $pgBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          $service = Get-Service -Name "postgresql*" | Select-Object -First 1
          if ($service.Status -ne "Running") { Start-Service $service.Name }
          for ($i = 0; $i -lt 30; $i++) {
            & "$pgBin\pg_isready.exe" -h localhost -p 5432
            if ($LASTEXITCODE -eq 0) { break }
            Start-Sleep -Seconds 2
          }
          if ($LASTEXITCODE -ne 0) { throw "PostgreSQL did not become ready" }
          $roleExists = & "$pgBin\psql.exe" -U postgres -tAc "SELECT 1 FROM pg_roles WHERE rolname='ehsbha'"
          if (-not $roleExists) {
            & "$pgBin\psql.exe" -U postgres -v ON_ERROR_STOP=1 -c "CREATE USER ehsbha WITH PASSWORD 'ehsbha_test_pass';"
          }
          $databaseExists = & "$pgBin\psql.exe" -U postgres -tAc "SELECT 1 FROM pg_database WHERE datname='ehsbha_test_ci'"
          if (-not $databaseExists) {
            & "$pgBin\createdb.exe" -U postgres -O ehsbha ehsbha_test_ci
          }

      - name: Install dependencies
        run: npm ci

      - name: Validate Git status
        shell: pwsh
        run: |
          git diff --check
          $sensitive = git ls-files --others --exclude-standard |
            Where-Object { $_ -match '(^|/)\.env($|\.)' -and $_ -notmatch '\.example$' }
          if ($sensitive) {
            throw "Untracked sensitive environment files: $($sensitive -join ', ')"
          }

      - name: Run verification
        run: npm run verify
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://ehsbha:ehsbha_test_pass@localhost:5432/ehsbha_test_ci
          JWT_DRIVER_SECRET: ci-test-driver-secret
          JWT_ADMIN_SECRET: ci-test-admin-secret
          OCR_SUBSTITUTE_MODE: true
          MAIL_SUBSTITUTE_MODE: true
          SMOKE_DRIVER_PHONE: +201000000001
          SMOKE_DRIVER_PASSWORD: demo-test-password
          ADMIN_SEED_PASSWORD: admin-test-password
          CI: true

      - name: Upload verification artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: verification-artifacts-windows
          path: |
            verification-output/
            docs/baseline/
            apps/api/test-results/
            !**/.env*
            !**/node_modules/**
            !**/*.jpeg
            !**/*.jpg
            !**/*.png
            !**/*.gif
            !**/test-fixtures/**
            !**/*.dump
            !**/*.sql
          retention-days: 7

      - name: Notify on failure
        if: failure() && github.ref == 'refs/heads/main'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `verification failed on ${process.env.GITHUB_REF_NAME}`,
              body: `Verification run ${context.runId} failed on Windows. See ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              labels: ['ci-failure']
            })
