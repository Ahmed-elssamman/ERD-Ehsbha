name: Verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  verify:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache npm downloads
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-22-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-22-npm-

      - name: Validate Neon CI configuration
        shell: pwsh
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL_CI }}
          DIRECT_URL: ${{ secrets.NEON_DIRECT_URL_CI }}
        run: |
          if (-not $env:DATABASE_URL) { throw "Missing secret NEON_DATABASE_URL_CI" }
          if (-not $env:DIRECT_URL) { throw "Missing secret NEON_DIRECT_URL_CI" }

      - name: Install dependencies
        run: npm ci

      - name: Install browser test runtime
        run: npx playwright install chromium

      - name: Validate Git status
        shell: pwsh
        run: |
          git diff --check
          $sensitive = git ls-files --others --exclude-standard |
            Where-Object { $_ -match '(^|/)\.env($|\.)' -and $_ -notmatch '\.example$' }
          if ($sensitive) {
            throw "Untracked sensitive environment files: $($sensitive -join ', ')"
          }

      - name: Run verification
        run: npm run verify
        env:
          NODE_ENV: test
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL_CI }}
          DIRECT_URL: ${{ secrets.NEON_DIRECT_URL_CI }}
          JWT_ACCESS_SECRET: ci-test-driver-access-secret-that-is-long-enough
          JWT_REFRESH_SECRET: ci-test-driver-refresh-secret-that-is-long-enough
          ADMIN_JWT_ACCESS_SECRET: ci-test-admin-access-secret-that-is-long-enough
          ADMIN_JWT_REFRESH_SECRET: ci-test-admin-refresh-secret-that-is-long-enough
          OCR_SUBSTITUTE_MODE: true
          MAIL_SUBSTITUTE_MODE: true
          GEMINI_API_KEY: ci-test-gemini-key-not-for-production
          SMOKE_DRIVER_PHONE: +201000000001
          SMOKE_DRIVER_PASSWORD: demo-test-password
          ADMIN_SEED_PASSWORD: admin-test-password
          CI: true

      - name: Upload verification artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: verification-artifacts-windows
          path: |
            verification-output/
            docs/baseline/
            apps/api/test-results/
            !**/.env*
            !**/node_modules/**
            !**/*.jpeg
            !**/*.jpg
            !**/*.png
            !**/*.gif
            !**/test-fixtures/**
            !**/*.dump
            !**/*.sql
          retention-days: 7

      - name: Notify on failure
        if: failure() && github.ref == 'refs/heads/main'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `verification failed on ${process.env.GITHUB_REF_NAME}`,
              body: `Verification run ${context.runId} failed on Windows. See ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              labels: ['ci-failure']
            })
